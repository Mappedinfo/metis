name: journal
version: 0.3.0
description: >
  Scientific figures with an Okabe-Ito categorical palette, compact sans-serif
  typography and vector-first export defaults. Use redundant encodings and
  inspect the final color and grayscale views.
palette:
  # Okabe-Ito color-universal-design palette: https://jfly.uni-koeln.de/color/
  # Accessibility depends on mark size, contrast and redundant encodings too.
  primary: "#0072B2"      # main series / emphasis
  secondary: "#E69F00"    # second series / contrast
  accent: "#009E73"       # highlight, positive result
  warn: "#D55E00"         # warning, negative result
  neutral: "#56B4E9"      # supporting series
  muted: "#999999"        # reference lines, inactive elements
  ink: "#1A1A1A"          # text and axes
  paper: "#FFFFFF"        # background
typography:
  body: "Helvetica, Arial, 'Noto Sans', sans-serif"
  heading: "Helvetica, Arial, 'Noto Sans', sans-serif"
  mono: "'JetBrains Mono', Menlo, Consolas, monospace"
  base_size_pt: 8         # journals print figures small; design at final size
  label_size_pt: 7
  title_size_pt: 9
figure:
  title_position: below
  caption_position: below
  panel_title_position: below
  dpi: 300
  format: [pdf, png]      # vector for submission, raster for preview
  column_width_mm: 89     # single-column reference width
  max_width_mm: 183       # double-column reference width
  line_width_pt: 0.75
chart_style:
  # Ordered series cycle; yellow is last because thin pale marks need dark edges.
  categorical: ["#0072B2", "#E69F00", "#009E73", "#D55E00", "#56B4E9", "#CC79A7", "#000000", "#F0E442"]
  # Metric ramps are independent of categorical colors. References:
  # https://matplotlib.org/stable/users/explain/colors/colormaps.html
  # https://doi.org/10.1371/journal.pone.0199239 (cividis)
  sequential: cividis
  diverging: BrBG
  markers: [o, s, "^", D, v, P, X, "*"]
  line_styles: ["-", "--", "-.", ":"]
  hatches: ["", "//", "\\\\", xx, "..", "++", oo, "--"]
