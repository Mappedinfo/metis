name: journal-npg
version: 0.1.0
description: >
  Scientific figures using the ggsci Nature Reviews Cancer-inspired NPG palette.
  This is not an official Nature style or a guarantee of colorblind or grayscale
  accessibility; inspect the final figure and retain redundant encodings.
palette:
  primary: "#E64B35"
  secondary: "#4DBBD5"
  accent: "#00A087"
  warn: "#DC0000"
  neutral: "#3C5488"
  muted: "#999999"
  ink: "#1A1A1A"
  paper: "#FFFFFF"
typography:
  body: "Helvetica, Arial, 'Noto Sans', sans-serif"
  heading: "Helvetica, Arial, 'Noto Sans', sans-serif"
  mono: "'JetBrains Mono', Menlo, Consolas, monospace"
  base_size_pt: 8
  label_size_pt: 7
  title_size_pt: 9
figure:
  dpi: 300
  format: [pdf, png]
  column_width_mm: 89
  max_width_mm: 183
  line_width_pt: 0.75
chart_style:
  # The ten NPG/nrc palette values, credited to Nan Xiao's ggsci:
  # https://nanx.me/ggsci/reference/pal_npg.html
  # https://github.com/nanxstats/ggsci/blob/master/R/palettes.R
  # No ggsci implementation code is incorporated.
  categorical: ["#E64B35", "#4DBBD5", "#00A087", "#3C5488", "#F39B7F", "#8491B4", "#91D1C2", "#DC0000", "#7E6148", "#B09C85"]
  # NPG is categorical; use separate metric ramps for ordered quantities.
  sequential: cividis
  diverging: BrBG
  markers: [o, s, "^", D, v, P, X, "*", "<", ">"]
  line_styles: ["-", "--", "-.", ":"]
  # Nature's guide avoids fill patterns; prefer shapes, labels and panels.
  # https://research-figure-guide.nature.com/figures/preparing-figures-our-specifications/
  hatches: [""]
